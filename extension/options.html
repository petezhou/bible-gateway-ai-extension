<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BibleGateway AI settings</title>
    <style>
      body { font: 16px/1.6 system-ui, sans-serif; color: #23362f; background: #fafbf6; max-width: 560px; margin: 64px auto; padding: 0 24px; }
      h1 { font-size: 26px; }
      label { display: block; font-weight: 600; margin-bottom: 8px; }
      input { box-sizing: border-box; width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #bdcdbf; border-radius: 8px; }
      button { font: inherit; padding: 9px 18px; background: #244d40; color: white; border: 0; border-radius: 8px; margin-top: 14px; cursor: pointer; }
      p { color: #667466; }
      #status { min-height: 26px; }
    </style>
  </head>
  <body>
    <h1>BibleGateway AI</h1>
    <p>Start your local study server, then highlight verses on BibleGateway and choose Ask AI.</p>
    <form>
      <label for="server">Local server address</label>
      <input id="server" type="url" required placeholder="http://127.0.0.1:8001">
      <button type="submit">Save</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p>API keys belong in the server's .env file. Answers use ESV reference text, even when you read another translation.</p>
    <script src="options.js"></script>
  </body>
</html>
